<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 800px; height: 600px; overflow: hidden; background: #080808; display: flex; align-items: center; justify-content: center; }
    svg { width: 800px; height: 600px; display: block; }
  </style>
</head>
<body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#EEDBB8"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="80%" stop-color="#785B2D"/>
      <stop offset="100%" stop-color="#C5A880"/>
    </linearGradient>
    <radialGradient id="bg2" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#C5A880" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <circle cx="400" cy="190" r="135" fill="none" stroke="#161616" stroke-width="1"/>
  <circle cx="400" cy="190" r="110" fill="none" stroke="#222222" stroke-width="0.75" stroke-dasharray="2 6"/>

  <g transform="translate(400, 190)" filter="url(#glow2)">
    <path d="M-90,-10 C-60,-85 60,-85 90,-10 C75,-25 35,-60 0,-60 C-35,-60 -75,-25 -90,-10 Z" 
          fill="url(#gold2)" opacity="0.9"/>

    <path d="M-65,65 C-45,15 -25,-35 0,-50 C-15,-10 -35,35 -45,65 Z" 
          fill="url(#gold2)"/>

    <path d="M65,65 C45,15 25,-35 0,-50 C15,-10 35,35 45,65 Z" 
          fill="url(#gold2)"/>

    <path d="M-30,45 C-15,10 0,-15 0,-15 C0,-15 15,10 30,45 C15,30 5,10 0,0 C-5,10 -15,30 -30,45 Z" 
          fill="url(#gold2)"/>

    <path d="M-80,68 L80,68 L70,72 L-70,72 Z" fill="url(#gold2)" opacity="0.75"/>
    
    <circle cx="0" cy="-25" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="400" y="390" 
        text-anchor="middle" 
        fill="#EDEDED" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="36" 
        font-weight="bold" 
        letter-spacing="10">AUTO MOJ</text>

  <line x1="270" y1="415" x2="380" y2="415" stroke="url(#gold2)" stroke-width="1" opacity="0.7"/>
  <circle cx="400" cy="415" r="2.5" fill="#C5A880"/>
  <line x1="420" y1="415" x2="530" y2="415" stroke="url(#gold2)" stroke-width="1" opacity="0.7"/>

  <text x="400" y="445" 
        text-anchor="middle" 
        fill="#C5A880" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="13" 
        font-weight="bold" 
        letter-spacing="7">PRESTIGE BODYSHOP</text>

  <text x="400" y="470" 
        text-anchor="middle" 
        fill="#888888" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="5">ACCIDENT REPAIR • LONDON</text>
</svg></body>
</html>
