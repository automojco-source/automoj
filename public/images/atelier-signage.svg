<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
  <defs>
    <linearGradient id="signGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E5"/>
      <stop offset="25%" stop-color="#E5D1AF"/>
      <stop offset="55%" stop-color="#C5A880"/>
      <stop offset="85%" stop-color="#7B5C30"/>
      <stop offset="100%" stop-color="#DEC6A2"/>
    </linearGradient>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="backlitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feFlood flood-color="#C5A880" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Architectural Dark Matt Composite Facade -->
  <rect width="1400" height="500" fill="url(#wallGradient)"/>
  
  <!-- Architectural Seam Lines (Panels) -->
  <line x1="0" y1="20" x2="1400" y2="20" stroke="#222222" stroke-width="1.5"/>
  <line x1="0" y1="480" x2="1400" y2="480" stroke="#222222" stroke-width="1.5"/>
  <line x1="280" y1="20" x2="280" y2="480" stroke="#1A1A1A" stroke-width="1.2"/>
  <line x1="1120" y1="20" x2="1120" y2="480" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Top Accent Illumination Ribbon -->
  <rect x="280" y="20" width="840" height="3" fill="url(#signGold)" opacity="0.8"/>

  <!-- Center Backlit 3D Channel Letters & Logo Sign -->
  <g transform="translate(700, 215)" filter="url(#backlitGlow)">
    <!-- Hex Emblem -->
    <g transform="translate(-320, 0)">
      <polygon points="0,-75 62,-37 62,37 0,75 -62,37 -62,-37" fill="#0C0C0C" stroke="url(#signGold)" stroke-width="3"/>
      <circle cx="0" cy="-75" r="3" fill="#FFF6E5"/>
      <circle cx="62" cy="-37" r="3" fill="#FFF6E5"/>
      <circle cx="62" cy="37" r="3" fill="#FFF6E5"/>
      <circle cx="0" cy="75" r="3" fill="#FFF6E5"/>
      <circle cx="-62" cy="37" r="3" fill="#FFF6E5"/>
      <circle cx="-62" cy="-37" r="3" fill="#FFF6E5"/>
      <!-- Interlocking AM -->
      <path d="M-28,36 L0,-40 L28,36 L15,36 L8,18 L-8,18 L-15,36 Z" fill="none" stroke="url(#signGold)" stroke-width="3.5"/>
      <path d="M-38,22 L-38,-12 L0,22 L38,-12 L38,22" fill="none" stroke="url(#signGold)" stroke-width="3" stroke-linecap="square"/>
      <polygon points="0,-5 5,1 0,7 -5,1" fill="url(#signGold)"/>
    </g>

    <!-- Main 3D Text -->
    <text x="-210" y="24" fill="#EDEDED" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" letter-spacing="16">AUTO MOJ</text>
  </g>

  <!-- Subtitle & Atelier Specialization -->
  <text x="700" y="340" text-anchor="middle" fill="#C5A880" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" letter-spacing="9">ACCIDENT REPAIR ATELIER • LONDON</text>
  
  <line x1="420" y1="375" x2="980" y2="375" stroke="#222222" stroke-width="1"/>
  
  <!-- Lower Services Grid on Facade -->
  <g transform="translate(700, 415)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="5" fill="#888888">
    <text x="-350">BODYWORK & STRUCTURAL</text>
    <text x="-120">•</text>
    <text x="0">LOW-BAKE RESPREY</text>
    <text x="120">•</text>
    <text x="350">PRECISION PDR DENT</text>
  </g>
</svg>