<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1600px;
    height: 950px;
    background: radial-gradient(circle at 50% 30%, #181818 0%, #060606 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .spotlight {
    position: absolute;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(197, 168, 128, 0.12) 0%, transparent 70%);
    filter: blur(50px);
    pointer-events: none;
  }
  .sl-1 { left: 15%; top: 10%; }
  .sl-2 { right: 15%; top: 15%; }

  .header {
    position: absolute;
    top: 40px;
    text-align: center;
    z-index: 10;
  }
  .header-badge {
    display: inline-block;
    padding: 6px 20px;
    border: 1px solid rgba(197, 168, 128, 0.45);
    background: rgba(12,12,12,0.85);
    color: #C5A880;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
    border-radius: 4px;
  }
  .header h1 {
    font-family: 'Times New Roman', serif;
    color: #FFFFFF;
    font-size: 28px;
    letter-spacing: 6px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
    margin-top: 55px;
    perspective: 1300px;
    z-index: 5;
  }
  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .card-frame {
    width: 630px;
    height: 360px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 
      0 40px 80px rgba(0, 0, 0, 0.95),
      0 12px 28px rgba(0, 0, 0, 0.85),
      0 0 45px rgba(197, 168, 128, 0.18);
    border: 1px solid rgba(197, 168, 128, 0.4);
  }
  .card-frame.left-card {
    transform: rotateY(14deg) rotateX(6deg) rotateZ(-2deg);
  }
  .card-frame.right-card {
    transform: rotateY(-14deg) rotateX(6deg) rotateZ(2deg);
  }
  .card-frame iframe {
    width: 1050px;
    height: 600px;
    border: none;
    transform: scale(0.6);
    transform-origin: top left;
    pointer-events: none;
  }
  .card-caption {
    color: #C5A880;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="spotlight sl-1"></div>
  <div class="spotlight sl-2"></div>

  <div class="header">
    <div class="header-badge">PRINT-CALIBRATED LUXURY STATIONERY</div>
    <h1>AUTO MOJ ACCIDENT REPAIR • LONDON</h1>
  </div>

  <div class="stage">
    <div class="card-wrap">
      <div class="card-frame left-card">
        <iframe src="./card-front.html"></iframe>
      </div>
      <div class="card-caption">FRONT SIDE • 3D EMBOSSED GOLD FOIL ON SOFT TOUCH</div>
    </div>

    <div class="card-wrap">
      <div class="card-frame right-card">
        <iframe src="./card-back.html"></iframe>
      </div>
      <div class="card-caption">BACK SIDE • HIGH-CONTRAST TYPE & SCAN-READY QR</div>
    </div>
  </div>
</body>
</html>
