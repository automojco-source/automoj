<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="cardGoldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF"/>
      <stop offset="25%" stop-color="#E5D1AF"/>
      <stop offset="55%" stop-color="#C5A880"/>
      <stop offset="85%" stop-color="#7B5C30"/>
      <stop offset="100%" stop-color="#DEC6A2"/>
    </linearGradient>
    <radialGradient id="cardBgBack" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1050" height="600" rx="16" fill="url(#cardBgBack)"/>
  <rect x="25" y="25" width="1000" height="550" rx="10" fill="none" stroke="url(#cardGoldBack)" stroke-width="1" opacity="0.3"/>

  <!-- Left Column: Executive Details -->
  <g transform="translate(80, 110)">
    <!-- Small Monogram -->
    <polygon points="0,-24 20,-12 20,12 0,24 -20,12 -20,-12" fill="#0C0C0C" stroke="url(#cardGoldBack)" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" fill="#C5A880" font-family="Georgia, serif" font-size="11" font-weight="bold">AM</text>

    <!-- Person / Department -->
    <text x="45" y="-5" fill="#FFFFFF" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="2">ATELIER DIRECTORS</text>
    <text x="45" y="20" fill="#C5A880" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="4">LUXURY CLAIMS & VALUATION</text>

    <line x1="0" y1="55" x2="520" y2="55" stroke="#222222" stroke-width="1"/>

    <!-- Contact Info -->
    <g transform="translate(0, 95)" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D0D0D0">
      <!-- Phone -->
      <text x="0" y="0" fill="#C5A880" font-weight="bold">TEL:</text>
      <text x="80" y="0" font-family="monospace" letter-spacing="1">+44 (0) 20 7123 6946</text>

      <!-- Mobile / 24/7 Accident Recovery -->
      <text x="0" y="38" fill="#C5A880" font-weight="bold">RECOVERY:</text>
      <text x="100" y="38" font-family="monospace" letter-spacing="1">+44 (0) 7700 900142</text>

      <!-- Email -->
      <text x="0" y="76" fill="#C5A880" font-weight="bold">EMAIL:</text>
      <text x="80" y="76">automoj.co@gmail.com</text>

      <!-- Web -->
      <text x="0" y="114" fill="#C5A880" font-weight="bold">WEB:</text>
      <text x="80" y="114">www.automoj.co.uk</text>

      <!-- Atelier Address -->
      <text x="0" y="152" fill="#C5A880" font-weight="bold">ATELIER:</text>
      <text x="80" y="152">Advanced Specialist Logistics, Bushey &amp; Oxhey Railway Yard, Watford WD19 4EA</text>
    </g>
  </g>

  <!-- Right Column: Instant Assessment QR Code & Services -->
  <g transform="translate(750, 110)">
    <!-- QR Container -->
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#0C0C0C" stroke="url(#cardGoldBack)" stroke-width="1.2"/>
    
    <!-- Stylized QR Representation -->
    <rect x="20" y="20" width="40" height="40" fill="url(#cardGoldBack)"/>
    <rect x="26" y="26" width="28" height="28" fill="#0C0C0C"/>
    <rect x="32" y="32" width="16" height="16" fill="url(#cardGoldBack)"/>

    <rect x="140" y="20" width="40" height="40" fill="url(#cardGoldBack)"/>
    <rect x="146" y="26" width="28" height="28" fill="#0C0C0C"/>
    <rect x="152" y="32" width="16" height="16" fill="url(#cardGoldBack)"/>

    <rect x="20" y="140" width="40" height="40" fill="url(#cardGoldBack)"/>
    <rect x="26" y="146" width="28" height="28" fill="#0C0C0C"/>
    <rect x="32" y="152" width="16" height="16" fill="url(#cardGoldBack)"/>

    <!-- Center Mini Emblem in QR -->
    <rect x="85" y="85" width="30" height="30" fill="#0C0C0C" stroke="url(#cardGoldBack)" stroke-width="1"/>
    <text x="100" y="103" text-anchor="middle" fill="#C5A880" font-family="Georgia, serif" font-size="9" font-weight="bold">AM</text>

    <!-- Data matrix dots -->
    <rect x="80" y="25" width="8" height="8" fill="#C5A880"/>
    <rect x="95" y="25" width="12" height="8" fill="#C5A880"/>
    <rect x="80" y="45" width="18" height="8" fill="#C5A880"/>
    <rect x="110" y="45" width="8" height="8" fill="#C5A880"/>
    <rect x="70" y="145" width="8" height="15" fill="#C5A880"/>
    <rect x="90" y="145" width="18" height="8" fill="#C5A880"/>
    <rect x="140" y="80" width="8" height="18" fill="#C5A880"/>
    <rect x="160" y="105" width="15" height="8" fill="#C5A880"/>
    <rect x="135" y="140" width="8" height="8" fill="#C5A880"/>
    <rect x="155" y="140" width="15" height="15" fill="#C5A880"/>

    <text x="100" y="235" text-anchor="middle" fill="#C5A880" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="3">SCAN FOR INSTANT QUOTE</text>
    <text x="100" y="255" text-anchor="middle" fill="#666666" font-family="system-ui, sans-serif" font-size="8" letter-spacing="2">UPLOAD ACCIDENT PHOTOS</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(80, 520)" font-family="system-ui, sans-serif" font-size="9" letter-spacing="3" fill="#888888">
    <text x="0" y="0">OEM CERTIFIED</text>
    <text x="160" y="0">•</text>
    <text x="190" y="0">LOW-BAKE REFINISHING</text>
    <text x="440" y="0">•</text>
    <text x="470" y="0">LIFETIME STRUCTURAL WARRANTY</text>
    <text x="780" y="0">•</text>
    <text x="810" y="0">INSURANCE APPROVED</text>
  </g>
</svg>