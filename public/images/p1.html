<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 800px; height: 600px; overflow: hidden; background: #080808; display: flex; align-items: center; justify-content: center; }
    svg { width: 800px; height: 600px; display: block; }
  </style>
</head>
<body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF"/>
      <stop offset="25%" stop-color="#E5D1AF"/>
      <stop offset="55%" stop-color="#C5A880"/>
      <stop offset="85%" stop-color="#7B5C30"/>
      <stop offset="100%" stop-color="#DEC6A2"/>
    </linearGradient>
    <radialGradient id="bg1" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg1)"/>
  
  <line x1="60" y1="290" x2="740" y2="290" stroke="#161616" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="400" y1="40" x2="400" y2="540" stroke="#161616" stroke-width="1" stroke-dasharray="4 8"/>

  <g transform="translate(400, 195)" filter="url(#shadow1)">
    <polygon points="0,-120 100,-60 100,60 0,120 -100,60 -100,-60" 
             fill="#0A0A0A" stroke="url(#gold1)" stroke-width="2.5"/>
             
    <polygon points="0,-108 90,-54 90,54 0,108 -90,54 -90,-54" 
             fill="none" stroke="url(#gold1)" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>

    <circle cx="0" cy="-120" r="3" fill="#FFF5DF"/>
    <circle cx="100" cy="-60" r="3" fill="#FFF5DF"/>
    <circle cx="100" cy="60" r="3" fill="#FFF5DF"/>
    <circle cx="0" cy="120" r="3" fill="#FFF5DF"/>
    <circle cx="-100" cy="60" r="3" fill="#FFF5DF"/>
    <circle cx="-100" cy="-60" r="3" fill="#FFF5DF"/>

    <!-- A Shape -->
    <path d="M-45,65 L0,-65 L45,65 L24,65 L14,28 L-14,28 L-24,55 Z" 
          fill="none" stroke="url(#gold1)" stroke-width="4.5" stroke-linejoin="miter"/>
          
    <!-- M Shape -->
    <path d="M-62,40 L-62,-22 L0,36 L62,-22 L62,40" 
          fill="none" stroke="url(#gold1)" stroke-width="4" stroke-linecap="square" stroke-linejoin="round"/>
          
    <!-- Center Diamond -->
    <polygon points="0,-8 8,2 0,12 -8,2" fill="url(#gold1)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="395" 
        text-anchor="middle" 
        fill="#EDEDED" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="36" 
        font-weight="bold" 
        letter-spacing="10">AUTO MOJ</text>

  <line x1="250" y1="420" x2="375" y2="420" stroke="url(#gold1)" stroke-width="1" opacity="0.6"/>
  <polygon points="400,417 404,420 400,423 396,420" fill="url(#gold1)"/>
  <line x1="425" y1="420" x2="550" y2="420" stroke="url(#gold1)" stroke-width="1" opacity="0.6"/>

  <text x="400" y="450" 
        text-anchor="middle" 
        fill="#C5A880" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="13" 
        font-weight="bold" 
        letter-spacing="6">ACCIDENT REPAIR ATELIER</text>

  <text x="400" y="475" 
        text-anchor="middle" 
        fill="#888888" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="5">PRESTIGE BODYSHOP • LONDON</text>
</svg></body>
</html>
