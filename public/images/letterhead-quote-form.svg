<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <linearGradient id="formGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#7B5C30"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimalist White/Cream Document Surface for High-End Printing -->
  <rect width="800" height="1130" fill="#FFFFFF"/>

  <!-- Top Dark Header Band -->
  <rect width="800" height="135" fill="#0C0C0C"/>
  <rect y="132" width="800" height="3" fill="#C5A880"/>

  <!-- Header Content -->
  <g transform="translate(50, 40)">
    <!-- Small Monogram -->
    <polygon points="0,-24 20,-12 20,12 0,24 -20,12 -20,-12" fill="#000" stroke="#C5A880" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#C5A880" font-family="Georgia, serif" font-size="12" font-weight="bold">AM</text>
    
    <g transform="translate(38, 0)">
      <text x="0" y="5" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="4">AUTO MOJ</text>
      <text x="0" y="24" fill="#C5A880" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" letter-spacing="3">ACCIDENT REPAIR ATELIER • LONDON</text>
    </g>
  </g>

  <g transform="translate(750, 48)" text-anchor="end" font-family="system-ui, sans-serif" fill="#AAAAAA" font-size="9" letter-spacing="1">
    <text x="0" y="0">14 PARK LANE, MAYFAIR, LONDON</text>
    <text x="0" y="16">TEL: +44 20 7946 0991 | CONCIERGE@AUTOMOJ.CO.UK</text>
    <text x="0" y="32" fill="#C5A880" font-weight="bold">INSURANCE LIAISON & ESTIMATION DEPT</text>
  </g>

  <!-- Document Title & Meta Box -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" fill="#111111" font-family="Georgia, serif" font-size="20" font-weight="bold" letter-spacing="2">ACCIDENT REPAIR ESTIMATION & CHECK-IN</text>
    <text x="0" y="18" fill="#666666" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1">REF: AM-2026-0894 | DATE: 09/09/2026 | ESTIMATOR: ATELIER TEAM</text>
  </g>

  <!-- Section 1: Client & Vehicle Details Table -->
  <g transform="translate(50, 220)">
    <rect width="700" height="95" fill="#F8F8F8" stroke="#E0E0E0" rx="4"/>
    <rect width="700" height="24" fill="#EFEFEF" rx="4"/>
    <text x="15" y="16" fill="#333333" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">1. CLIENT & VEHICLE SPECIFICATION</text>

    <g transform="translate(15, 45)" font-family="system-ui, sans-serif" font-size="10" fill="#444444">
      <text x="0" y="0"><tspan font-weight="bold">Client:</tspan> Lord Sterling</text>
      <text x="240" y="0"><tspan font-weight="bold">Contact:</tspan> +44 7911 123456</text>
      <text x="480" y="0"><tspan font-weight="bold">Claim No:</tspan> AXA-99201-UK</text>

      <text x="0" y="28"><tspan font-weight="bold">Make/Model:</tspan> Porsche 911 GT3 RS</text>
      <text x="240" y="28"><tspan font-weight="bold">Reg:</tspan> MOJ 911</text>
      <text x="480" y="28"><tspan font-weight="bold">Mileage:</tspan> 4,280 mi</text>
    </g>
  </g>

  <!-- Section 2: Vehicle Damage Diagram (Stylized Inspection Grid) -->
  <g transform="translate(50, 340)">
    <rect width="700" height="180" fill="#FCFCFC" stroke="#E0E0E0" rx="4"/>
    <rect width="700" height="24" fill="#EFEFEF" rx="4"/>
    <text x="15" y="16" fill="#333333" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">2. DAMAGE ASSESSMENT & BODYWORK LOCATIONS</text>

    <!-- Top-down car contour wireframe diagram -->
    <g transform="translate(350, 110)" stroke="#777777" fill="none" stroke-width="1.2">
      <!-- Car silhouette -->
      <path d="M-60,-55 C-40,-65 40,-65 60,-55 C70,-45 75,0 75,45 C75,55 55,60 0,60 C-55,60 -75,55 -75,45 C-75,0 -70,-45 -60,-55 Z"/>
      <!-- Windshield -->
      <path d="M-45,-25 C-30,-30 30,-30 45,-25 L38,-5 L-38,-5 Z"/>
      <!-- Rear window -->
      <path d="M-40,25 C-25,28 25,28 40,25 L35,38 L-35,38 Z"/>
      
      <!-- Damage Markers (Red Circles) -->
      <circle cx="68" cy="-15" r="9" stroke="#E53E3E" stroke-width="2" fill="#FED7D7"/>
      <text x="68" y="-12" text-anchor="middle" stroke="none" fill="#C53030" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">1</text>

      <circle cx="-50" cy="50" r="9" stroke="#E53E3E" stroke-width="2" fill="#FED7D7"/>
      <text x="-50" y="53" text-anchor="middle" stroke="none" fill="#C53030" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">2</text>
    </g>

    <!-- Damage Legend -->
    <g transform="translate(500, 55)" font-family="system-ui, sans-serif" font-size="9" fill="#555555">
      <text x="0" y="0"><tspan font-weight="bold" fill="#C53030">Point 1:</tspan> Right Front Wing Impact (PDR + Respray)</text>
      <text x="0" y="20"><tspan font-weight="bold" fill="#C53030">Point 2:</tspan> Rear Bumper Scuff & Diffuser Realignment</text>
      <text x="0" y="40"><tspan font-weight="bold" fill="#2B6CB0">Chassis:</tspan> Laser Frame Tolerance Verified ±0.2mm</text>
      <text x="0" y="60"><tspan font-weight="bold" fill="#2F855A">Finish:</tspan> Low-Bake Factory Match Primer & E-Coat</text>
    </g>
  </g>

  <!-- Section 3: Cost Breakdown Table -->
  <g transform="translate(50, 545)">
    <rect width="700" height="260" fill="#FFFFFF" stroke="#E0E0E0" rx="4"/>
    <!-- Table Header -->
    <rect width="700" height="26" fill="#141414" rx="4"/>
    <g fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" letter-spacing="1">
      <text x="15" y="17">ITEM / DISCIPLINE</text>
      <text x="360" y="17">HRS / SPEC</text>
      <text x="480" y="17">LABOUR</text>
      <text x="590" y="17">MATERIALS</text>
      <text x="650" y="17">TOTAL</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(15, 50)" font-family="system-ui, sans-serif" font-size="10" fill="#333333">
      <text x="0" y="0" font-weight="bold">Precision PDR Dent Removal (Right Wing)</text>
      <text x="345" y="0" fill="#777">3.5 Hrs</text>
      <text x="465" y="0">£350.00</text>
      <text x="575" y="0">£45.00</text>
      <text x="635" y="0" font-weight="bold">£395.00</text>
    </g>
    <line x1="15" y1="605" x2="735" y2="605" stroke="#EEE" stroke-width="1"/>

    <!-- Row 2 -->
    <g transform="translate(15, 85)" font-family="system-ui, sans-serif" font-size="10" fill="#333333">
      <text x="0" y="0" font-weight="bold">Low-Bake Oven Respray & Pearlescent Blend</text>
      <text x="345" y="0" fill="#777">Stage 3 OEM</text>
      <text x="465" y="0">£520.00</text>
      <text x="575" y="0">£180.00</text>
      <text x="635" y="0" font-weight="bold">£700.00</text>
    </g>
    <line x1="15" y1="640" x2="735" y2="640" stroke="#EEE" stroke-width="1"/>

    <!-- Row 3 -->
    <g transform="translate(15, 120)" font-family="system-ui, sans-serif" font-size="10" fill="#333333">
      <text x="0" y="0" font-weight="bold">Carbon Fiber Rear Diffuser Realignment</text>
      <text x="345" y="0" fill="#777">Aerospace Grade</text>
      <text x="465" y="0">£240.00</text>
      <text x="575" y="0">£60.00</text>
      <text x="635" y="0" font-weight="bold">£300.00</text>
    </g>
    <line x1="15" y1="675" x2="735" y2="675" stroke="#EEE" stroke-width="1"/>

    <!-- Row 4 -->
    <g transform="translate(15, 155)" font-family="system-ui, sans-serif" font-size="10" fill="#333333">
      <text x="0" y="0" font-weight="bold">Post-Repair Laser Alignment & Road Test</text>
      <text x="345" y="0" fill="#777">Cert. M10</text>
      <text x="465" y="0">£120.00</text>
      <text x="575" y="0">£0.00</text>
      <text x="635" y="0" font-weight="bold">£120.00</text>
    </g>

    <!-- Subtotal & Total Box -->
    <rect x="450" y="180" width="250" height="75" fill="#F7F7F7" rx="4"/>
    <g transform="translate(470, 202)" font-family="system-ui, sans-serif" font-size="10">
      <text x="0" y="0" fill="#666666">Net Subtotal:</text>
      <text x="160" y="0" text-anchor="end" font-weight="bold">£1,515.00</text>

      <text x="0" y="20" fill="#666666">VAT (20%):</text>
      <text x="160" y="20" text-anchor="end">£303.00</text>

      <text x="0" y="42" fill="#111111" font-weight="bold" font-size="12">FINAL TOTAL:</text>
      <text x="160" y="42" text-anchor="end" fill="#C5A880" font-weight="bold" font-size="13">£1,818.00</text>
    </g>
  </g>

  <!-- Section 4: Signatures & Lifetime Warranty Seal -->
  <g transform="translate(50, 835)">
    <rect width="700" height="170" fill="#FAF8F5" stroke="#E6DFD5" rx="4"/>
    
    <g transform="translate(30, 30)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#0C0C0C" stroke="#C5A880" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" fill="#C5A880" font-family="Georgia, serif" font-size="8" font-weight="bold">AM</text>
      <text x="25" y="3" fill="#111111" font-family="Georgia, serif" font-size="11" font-weight="bold">LIFETIME STRUCTURAL WARRANTY INCLUDED</text>
      <text x="25" y="18" fill="#777777" font-family="system-ui, sans-serif" font-size="8">All metal shaping, anti-corrosion primer and frame realignment guaranteed for vehicle lifetime.</text>
    </g>

    <!-- Signatures -->
    <g transform="translate(30, 100)" font-family="system-ui, sans-serif" font-size="9" fill="#444444">
      <line x1="0" y1="25" x2="280" y2="25" stroke="#BBB" stroke-width="1"/>
      <text x="0" y="40">AUTHORISED ATELIER SIGNATURE & STAMP</text>

      <line x1="360" y1="25" x2="640" y2="25" stroke="#BBB" stroke-width="1"/>
      <text x="360" y="40">CLIENT ACCEPTANCE & VEHICLE HANDOVER</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(400, 1070)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" letter-spacing="2" fill="#999999">
    <text x="0" y="0">AUTO MOJ ACCIDENT REPAIR LTD • REGISTERED IN ENGLAND & WALES</text>
    <text x="0" y="15">MAYFAIR ATELIER • WWW.AUTOMOJ.CO.UK</text>
  </g>
</svg>