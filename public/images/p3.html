<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 800px; height: 600px; overflow: hidden; background: #080808; display: flex; align-items: center; justify-content: center; }
    svg { width: 800px; height: 600px; display: block; }
  </style>
</head>
<body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF"/>
      <stop offset="30%" stop-color="#DEC094"/>
      <stop offset="65%" stop-color="#9D7842"/>
      <stop offset="100%" stop-color="#EADAC2"/>
    </linearGradient>
    <radialGradient id="bg3" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <g transform="translate(400, 185)" opacity="0.7">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#222222" stroke-width="1"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#gold3)" stroke-width="0.75" stroke-dasharray="3 7"/>
    
    <line x1="0" y1="-120" x2="0" y2="-110" stroke="url(#gold3)" stroke-width="2"/>
    <line x1="120" y1="0" x2="110" y2="0" stroke="url(#gold3)" stroke-width="2"/>
    <line x1="0" y1="120" x2="0" y2="110" stroke="url(#gold3)" stroke-width="2"/>
    <line x1="-120" y1="0" x2="-110" y2="0" stroke="url(#gold3)" stroke-width="2"/>
  </g>

  <g transform="translate(400, 185)" filter="url(#shadow3)">
    <polygon points="0,-85 60,-60 85,0 60,60 0,85 -60,60 -85,0 -60,-60" 
             fill="#080808" stroke="url(#gold3)" stroke-width="2.5"/>

    <path d="M-38,45 L0,-65 L38,45 L22,45 L0,-25 L-22,45 Z" fill="url(#gold3)"/>

    <path d="M-50,45 L-25,-10 L0,25 L25,-10 L50,45 L36,45 L25,18 L0,50 L-25,18 L-36,45 Z" 
          fill="url(#gold3)" opacity="0.95"/>

    <circle cx="0" cy="-65" r="3" fill="#FFF5DF"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#080808" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="400" y="385" 
        text-anchor="middle" 
        fill="#EDEDED" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="36" 
        font-weight="bold" 
        letter-spacing="10">AUTO MOJ</text>

  <line x1="240" y1="410" x2="560" y2="410" stroke="url(#gold3)" stroke-width="0.75" opacity="0.5"/>

  <text x="400" y="440" 
        text-anchor="middle" 
        fill="#C5A880" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="13" 
        font-weight="bold" 
        letter-spacing="6">BESPOKE ACCIDENT REPAIR</text>

  <text x="400" y="465" 
        text-anchor="middle" 
        fill="#888888" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="5">LONDON ATELIER • EST. 2024</text>
</svg></body>
</html>
