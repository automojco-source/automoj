<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1050px;
    height: 600px;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Times New Roman', Georgia, serif;
    overflow: hidden;
  }
  .card-container {
    width: 1050px;
    height: 600px;
    position: relative;
    background: radial-gradient(circle at 50% 45%, #181818 0%, #080808 100%);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.85);
    overflow: hidden;
  }
  /* Safety Margin / Bleed Guard Border (3.5mm inside cut) */
  .safe-border {
    position: absolute;
    top: 24px; bottom: 24px; left: 24px; right: 24px;
    border: 1.5px solid rgba(197, 168, 128, 0.4);
    border-radius: 6px;
    pointer-events: none;
  }
  .inner-guide {
    position: absolute;
    top: 34px; bottom: 34px; left: 34px; right: 34px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 4px;
    pointer-events: none;
  }
  .corner-accent {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #C5A880;
    border-radius: 50%;
    box-shadow: 0 0 8px #C5A880;
  }
  .ca-tl { top: 21px; left: 21px; }
  .ca-tr { top: 21px; right: 21px; }
  .ca-bl { bottom: 21px; left: 21px; }
  .ca-br { bottom: 21px; right: 21px; }

  /* Central 3D Emblem: 220px (~18mm high) */
  .logo-wrapper {
    width: 210px;
    height: 210px;
    position: relative;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 45px rgba(197, 168, 128, 0.25));
  }
  .logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
    mask-image: radial-gradient(circle at center, black 65%, transparent 98%);
    -webkit-mask-image: radial-gradient(circle at center, black 65%, transparent 98%);
  }

  /* Typography: Large & High Contrast */
  .brand-title {
    color: #FFFFFF;
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 12px;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-shadow: 0 3px 12px rgba(0,0,0,0.9);
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 380px;
    margin-bottom: 14px;
  }
  .divider-line {
    flex: 1;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #C5A880, transparent);
  }
  .divider-diamond {
    width: 8px;
    height: 8px;
    background: #C5A880;
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(197, 168, 128, 0.9);
  }
  .subtitle {
    color: #C5A880;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 7px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .location {
    color: #A0A0A0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card-container">
    <div class="safe-border"></div>
    <div class="inner-guide"></div>
    <div class="corner-accent ca-tl"></div>
    <div class="corner-accent ca-tr"></div>
    <div class="corner-accent ca-bl"></div>
    <div class="corner-accent ca-br"></div>

    <div class="logo-wrapper">
      <img src="./site-icon.png" alt="Auto Moj Emblem">
    </div>

    <h1 class="brand-title">AUTO MOJ</h1>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <div class="subtitle">ACCIDENT REPAIR ATELIER</div>
    <div class="location">LONDON • WATFORD</div>
  </div>
</body>
</html>
